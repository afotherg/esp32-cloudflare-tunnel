[platformio]
default_envs = heltec_wifi_lora_32_v3

[env:heltec_wifi_lora_32_v3]
platform = espressif32@6.13.0
framework = espidf
extra_scripts = pre:tools/embed_dashboard.py
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

# Hardware regression test; do not deploy this environment for normal operation.
[env:dns_timeout_test]
extends = env:heltec_wifi_lora_32_v3
build_flags = ${env:heltec_wifi_lora_32_v3.build_flags} -DESP32_TEST_DNS_TIMEOUTS
